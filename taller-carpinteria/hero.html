<!-- Taller de carpinteria - hero con scrub -->
<section class="hero">
  <video id="hero-video" src="video/hero.mp4" muted playsinline preload="auto"></video>
  <div class="hero__scrim"></div>
  <div class="hero__copy">
    <h1>Muebles a medida,<br>hechos a mano</h1>
    <a class="hero__cta" href="#contacto">Pedir presupuesto</a>
  </div>
</section>

<style>
.hero{position:relative;height:100vh;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Velo: en el tercio del titular el brillo va de 121 a 109 y el detalle de
   2,00 a 1,35 a lo largo del clip. Es estable, asi que alcanza un velo suave;
   la franja superior si lo necesita porque el tablero le entra por la derecha. */
.hero__scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(28,20,14,.52) 0%,rgba(28,20,14,.34) 34%,transparent 58%),
             linear-gradient(180deg,rgba(28,20,14,.45) 0%,transparent 22%)}

.hero__copy{position:absolute;left:6%;top:50%;transform:translateY(-50%);
  max-width:32%;color:#f5efe6}
.hero__copy h1{font-size:clamp(2rem,4.4vw,4rem);line-height:1.05;margin:0 0 1.5rem}
.hero__cta{display:inline-block;padding:.9rem 1.8rem;border:1px solid #f5efe6;
  color:#f5efe6;text-decoration:none;border-radius:2px}
</style>

<script>
// scrub: sin autoplay, o se reproduce solo en vez de scrubearse
const v = document.getElementById('hero-video');
v.addEventListener('loadedmetadata', () => {
  gsap.to(v, {
    currentTime: v.duration,
    ease: 'none',
    scrollTrigger: {
      trigger: '.hero',
      start: 'top top',
      end: '+=200%',
      scrub: 1,
      pin: true
    }
  });
});
</script>
