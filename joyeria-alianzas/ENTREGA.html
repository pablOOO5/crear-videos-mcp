<!-- Hero con scrub — joyeria-alianzas -->
<!-- El video mide 1280x716 (1.788:1). hero.mp4 va al hosting del cliente. -->

<section class="hero">
  <video class="hero__video" src="hero.mp4" muted playsinline preload="auto"></video>

  <!-- Velo SOLO para la navbar. Medido: del 33% hacia la derecha la franja
       superior llega a p99 237 cuando entra la mano a tomar el estuche
       (entre s0,75 y s4,3). El tercio izquierdo se mantiene en p99 19, asi que
       el logo no lo necesita: el velo arranca transparente a la izquierda. -->
  <div class="hero__navscrim" aria-hidden="true"></div>

  <nav class="hero__nav">
    <a class="hero__logo" href="/">LOGO</a>
    <ul class="hero__links">
      <li><a href="#alianzas">Alianzas</a></li>
      <li><a href="#taller">Taller</a></li>
      <li><a href="#cita">Pedir cita</a></li>
    </ul>
  </nav>

  <!-- El titular NO puede pasar del 33% del ancho: medido, la mitad izquierda
       llega a p95 180 en el medio del clip, el tercio izquierdo nunca supera 28. -->
  <div class="hero__copy">
    <h1>El anillo que van a usar toda la vida</h1>
    <p>Alianzas de oro blanco, hechas a medida en nuestro taller.</p>
    <a class="hero__cta" href="#cita">Pedir una cita</a>
  </div>
</section>

<style>
.hero{position:relative;width:100%;aspect-ratio:1280/716;overflow:hidden;background:#000}
.hero__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.hero__navscrim{
  position:absolute;top:0;left:0;right:0;height:12%;pointer-events:none;
  background:linear-gradient(to right,transparent 0%,transparent 28%,rgba(0,0,0,.62) 42%,rgba(0,0,0,.62) 100%);
}

.hero__nav{position:absolute;top:0;left:0;right:0;height:12%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4vw;color:#fff}
.hero__logo{color:#fff;text-decoration:none;letter-spacing:.18em;font-size:clamp(12px,1.1vw,16px)}
.hero__links{display:flex;gap:2.2vw;list-style:none;margin:0;padding:0}
.hero__links a{color:#fff;text-decoration:none;font-size:clamp(12px,1vw,15px)}

.hero__copy{position:absolute;left:4vw;top:50%;transform:translateY(-50%);
  width:29%;color:#fff}                 /* 4% + 29% = 33%: el limite medido */
.hero__copy h1{margin:0 0 .6em;font-size:clamp(22px,2.6vw,44px);line-height:1.12;font-weight:400}
.hero__copy p{margin:0 0 1.4em;font-size:clamp(13px,1.05vw,17px);opacity:.85;line-height:1.5}
.hero__cta{display:inline-block;padding:.8em 1.6em;border:1px solid rgba(255,255,255,.65);
  color:#fff;text-decoration:none;font-size:clamp(12px,.95vw,15px);letter-spacing:.08em}

@media (max-width:700px){
  .hero__copy{width:56%}
  .hero__navscrim{background:rgba(0,0,0,.62)}
}
</style>

<script>
// GSAP + ScrollTrigger
const hero  = document.querySelector('.hero');
const video = document.querySelector('.hero__video');

video.addEventListener('loadedmetadata', () => {
  gsap.to(video, {
    currentTime: video.duration,
    ease: 'none',
    scrollTrigger: {
      trigger: hero,
      start: 'top top',
      end: '+=200%',     // subilo a +=300% si el recorrido se siente corto: no cuesta creditos
      scrub: 1,          // 1s de suavizado, disimula cualquier salto residual
      pin: true
    }
  });
});
</script>
